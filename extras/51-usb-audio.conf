# The USB speaker and mic dongles can't hold their endpoints at the same time on this
# xHCI controller (ENOMEM). Release each one quickly once it goes idle (default is 5s).
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.usb-10ae_USB_Audio.*" }
      { node.name = "~alsa_input.usb-Generic_USB_Audio.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 1
      }
    }
  }
]
